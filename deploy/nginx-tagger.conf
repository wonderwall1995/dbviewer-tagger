# Nginx 사이트 (setup-server.sh 가 __DOMAIN__ 을 바꿔 /etc/nginx/sites-available/tagger 로 설치한다).
# 처음에는 80번만 둔다. HTTPS는 certbot --nginx 가 이 파일에 넣는다.
# default_server는 쓰지 않는다 (이 서버의 다른 사이트가 가지고 있다).

server {
    listen 80;
    server_name __DOMAIN__;

    root /var/www/tagger;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 입장: 같은 IP에서 1분에 10번까지 (앱도 10분 10번 실패를 따로 막는다)
    location = /api/login {
        limit_req zone=taggerlogin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/tagger/tagger.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 진행률 알림(SSE): 버퍼링 없이 오래 열어 둔다
    location = /api/events {
        proxy_pass http://unix:/run/tagger/tagger.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # CSV 올리기: 앱의 업로드 상한(TAGGER_UPLOAD_MB)보다 조금 크게
    location = /api/upload {
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_pass http://unix:/run/tagger/tagger.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DB 내보내기: 끝나야 한 번 응답하므로 기본 60초로는 끊긴다. 30분까지 기다린다.
    # (브라우저나 Nginx가 연결을 끊으면 서버는 내보내기를 멈춘다. 같은 세션의 내보내기는 한 번에 하나다)
    location ~ ^/api/call/db:export(Tables|Schemas)$ {
        client_max_body_size 1m;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        proxy_pass http://unix:/run/tagger/tagger.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 API (본문 상한은 앱의 JSON 상한 20MB에 맞춘다)
    location /api/ {
        client_max_body_size 21m;
        proxy_pass http://unix:/run/tagger/tagger.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면 (단일 페이지 앱). 새로고침해도 열린다.
    location / {
        try_files $uri /index.html;
    }
}
